services:
  - type: web
    name: telegram-file-downloader-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    plan: free
    autoDeploy: true
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: FORCE_SUB_CHANNEL
        sync: false
      - key: MONGO_URI
        sync: false
      - key: PORT
        value: 8080
